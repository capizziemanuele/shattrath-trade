<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shattrath">
<title>Shattrath Trade — Outland Professions Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Marcellus&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#ffd100; --gold2:#c9a23c; --gold3:#8a6a26; --ink:#0b0806; --wood:#1d140c; --wood2:#130d08;
  --q0:#9d9d9d; --q1:#ffffff; --q2:#1eff00; --q3:#0070dd; --q4:#a335ee; --q5:#ff8000;
  --orange:#ff8040; --yellow:#ffff00; --green:#40bf40; --gray:#808080;
  --ui: 'Marcellus', 'Palatino Linotype', Georgia, serif;
  --num: 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--ui); color:#fff; font-size:14px; background:#070504;
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(120,70,20,.25), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(60,20,80,.25), transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button,input,select{font-family:inherit}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Frames ---------- */
.frame{
  position:relative; background:linear-gradient(180deg,#1b130c 0%,#120c07 100%);
  border:1px solid #000; outline:1px solid #5d4627; outline-offset:-4px;
  box-shadow:0 0 0 1px #2a1e10, 0 0 0 3px #000, inset 0 0 0 4px #000, inset 0 0 0 5px #3c2c18, inset 0 0 40px rgba(0,0,0,.7), 0 8px 30px rgba(0,0,0,.6);
  border-radius:3px;
}
.frame::before,.frame::after{content:'';position:absolute;width:9px;height:9px;background:linear-gradient(135deg,#f6dd8b,#9a7429);transform:rotate(45deg);top:-4px;left:-4px;box-shadow:0 0 0 1px #000;z-index:2}
.frame::after{left:auto;right:-4px}
.ftitle{
  margin:6px 6px 0; padding:7px 12px 6px; text-align:center; color:var(--gold); font-size:15px; letter-spacing:.5px;
  background:linear-gradient(180deg,#3a0c08,#1e0604); border:1px solid #000; box-shadow:inset 0 0 0 1px #6b2a17, inset 0 6px 10px rgba(255,120,60,.08);
  text-shadow:0 1px 0 #000, 0 0 6px rgba(0,0,0,.8);
}
.fbody{padding:10px 12px 12px}
.parch{
  background:#e8d6b0; color:#2b1a0c;
  background-image:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.35), transparent 55%);
  border:1px solid #6b4b22; box-shadow:inset 0 0 25px rgba(90,55,20,.55); border-radius:2px; padding:10px 12px;
}
.parch .tq1{color:#2b1a0c}.parch .ilink:not(.tq1){text-shadow:0 0 2px #000,0 1px 1px #000}
.parch h3{margin:0 0 4px;font-size:16px;color:#3a1d05}
.sep{height:1px;background:linear-gradient(90deg,transparent,#6b5532,transparent);margin:10px 0}
.lbl{color:var(--gold);}
.muted{color:#a89a85}
.small{font-size:12px}
.num{font-family:var(--num)}
.red{color:#ff2020}.grn{color:#1eff00}.yel{color:#ffd100}.wht{color:#fff}

/* ---------- Buttons (UIPanelButton) ---------- */
.btn{
  font-family:var(--ui); font-size:13px; color:var(--gold); cursor:pointer; padding:5px 12px; min-height:26px;
  background:linear-gradient(180deg,#a5160c 0%,#6b0904 48%,#4a0502 52%,#5d0703 100%);
  border:1px solid #000; border-radius:3px; box-shadow:inset 0 0 0 1px #d0603c66, inset 0 1px 0 #ff9b7a55, 0 1px 2px #000;
  text-shadow:0 1px 1px #000; white-space:nowrap;
}
.btn:hover{filter:brightness(1.25); color:#fff}
.btn:active{transform:translateY(1px); filter:brightness(.85)}
.btn[disabled]{filter:grayscale(1) brightness(.6); color:#999; cursor:default; transform:none}
.btn.dark{background:linear-gradient(180deg,#3d3427,#211b13); box-shadow:inset 0 0 0 1px #6b5532, 0 1px 2px #000}
.btn.sm{padding:2px 8px;font-size:12px;min-height:22px}
.btn.big{font-size:17px;padding:9px 26px}

/* ---------- Icons ---------- */
.ic{position:relative;display:inline-block;width:40px;height:40px;flex:none;border-radius:4px;background:#222 linear-gradient(135deg,#3a3a3a,#141414);
  box-shadow:0 0 0 1px #000, 0 0 0 2px var(--qc,#444), 0 2px 4px #000; overflow:hidden; vertical-align:middle}
.ic::before{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13px var(--num);color:var(--qc,#ccc);text-shadow:0 1px 2px #000}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
.ic .ct{position:absolute;right:2px;bottom:0;font:700 13px var(--num);color:#fff;z-index:2;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.ic.s32{width:32px;height:32px}.ic.s26{width:26px;height:26px}.ic.s26 .ct{font-size:11px}.ic.s20{width:20px;height:20px;border-radius:3px}.ic.s56{width:56px;height:56px}
.ic.dim img{filter:grayscale(1) brightness(.5)}
.q0{--qc:var(--q0)}.q1{--qc:#5a5a5a}.q2{--qc:var(--q2)}.q3{--qc:var(--q3)}.q4{--qc:var(--q4)}.q5{--qc:var(--q5)}
.tq0{color:var(--q0)}.tq1{color:var(--q1)}.tq2{color:var(--q2)}.tq3{color:#2a8cff}.tq4{color:#b558ff}.tq5{color:var(--q5)}
.link{cursor:pointer}.link:hover{text-decoration:underline}

/* ---------- Money ---------- */
.money{font-family:var(--num);font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 1px 1px #000}
.money i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 2px;vertical-align:-1px;box-shadow:0 0 0 1px #000a}
.money .cg{background:radial-gradient(circle at 35% 35%,#fff5b0,#f2c230 45%,#8a6408)}
.money .cs{background:radial-gradient(circle at 35% 35%,#fff,#c8c8c8 45%,#6d6d6d)}
.money .cc{background:radial-gradient(circle at 35% 35%,#ffd2a8,#c9733a 45%,#6b3412)}

/* ---------- Bars ---------- */
.bar{position:relative;height:18px;background:#000;border:1px solid #6e6e6e;border-radius:2px;box-shadow:0 0 0 1px #000, inset 0 0 6px #000;overflow:hidden}
.bar>.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#ffd257,#d99400 50%,#b37200);width:0}
.bar>.fill::after{content:'';position:absolute;right:-6px;top:-3px;bottom:-3px;width:12px;background:radial-gradient(ellipse,#fff8 0,#ffd10044 40%,transparent 70%)}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;text-shadow:0 1px 1px #000,0 0 3px #000;white-space:nowrap}
.bar.skill>.fill{background:linear-gradient(180deg,#5a68ff,#2533c9 55%,#1a248f)}
.bar.skill>.fill::after{display:none}
.bar.rep>.fill{background:linear-gradient(180deg,#3fd23f,#118d11)}
.bar.green>.fill{background:linear-gradient(180deg,#5fe05f,#1c8a1c)}
.bar.thin{height:12px}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(180deg,#120b06,#0b0704);border-bottom:1px solid #4d3a1e;box-shadow:0 2px 0 #000,0 6px 20px #000a;position:sticky;top:0;z-index:30}
.logo{font-family:'Cinzel',serif;font-weight:900;font-size:20px;letter-spacing:1px;line-height:1;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#fff2b0 0%,#f5c542 45%,#b77c12 55%,#ffe27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 #000) drop-shadow(0 0 6px rgba(255,160,40,.25))}
.logo small{display:block;font-family:var(--ui);font-weight:400;font-size:10px;letter-spacing:2px;color:#b89a5a;-webkit-text-fill-color:#b89a5a;margin-top:2px}
.who{margin-left:auto;text-align:right;line-height:1.25}
.who .nm{color:#fff;font-size:15px}.who .tt{color:var(--gold);font-size:11px}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px;max-width:1280px;width:100%;margin:0 auto}
#side{display:flex;flex-direction:column;gap:14px;min-width:0}
#main{min-width:0}
.tabs{display:flex;gap:2px;padding:0 8px;margin-top:-1px}
nav.tabs{position:sticky;bottom:0;z-index:30;background:linear-gradient(0deg,#0b0704,#140d07);border-top:1px solid #4d3a1e;padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:center;flex-wrap:nowrap;overflow-x:auto}
.tab{font-family:var(--ui);cursor:pointer;color:#d8c08a;background:linear-gradient(180deg,#2a1e12,#170f08);border:1px solid #000;box-shadow:inset 0 0 0 1px #5d4627;border-radius:4px 4px 2px 2px;padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .ic{width:20px;height:20px;border-radius:3px}
.tab.on{color:var(--gold);background:linear-gradient(180deg,#4a1a0e,#220905);box-shadow:inset 0 0 0 1px #b07a32, 0 0 10px rgba(255,180,60,.2)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:#ff3c1e;box-shadow:0 0 6px #ff3c1e}
.subtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.subtabs .tab{padding:5px 10px;font-size:12.5px}

/* ---------- Lists ---------- */
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid #2a1f13;min-height:48px}
.row:hover{background:rgba(255,209,0,.04)}
.row.sel{background:linear-gradient(90deg,rgba(255,209,0,.12),transparent);box-shadow:inset 2px 0 0 var(--gold)}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:#a89a85;margin-top:2px}
.row.locked{opacity:.55}
.drops{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:8px;background:rgba(0,0,0,.35);border:1px solid #2c2014;border-radius:3px}
.grid .slot{width:44px;height:44px;border-radius:4px;background:#0e0b08;box-shadow:inset 0 0 0 1px #2d2318,inset 0 0 8px #000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.grid .slot .ic{width:40px;height:40px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.hint{font-size:12px;color:#a89a85;font-style:italic}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid #5d4627;color:#d8c08a;background:#1a120a}
input.inp,select.inp{background:#0c0906;border:1px solid #5d4627;color:#fff;padding:7px 9px;border-radius:3px;font-size:14px;outline:none;box-shadow:inset 0 0 6px #000}
input.inp:focus{border-color:#b07a32}

/* ---------- Tradeskill colors ---------- */
.d0{color:var(--orange)}.d1{color:var(--yellow)}.d2{color:var(--green)}.d3{color:var(--gray)}

/* ---------- Now panel ---------- */
.now .line{display:flex;align-items:center;gap:10px}
.now .lt{font-size:13px;line-height:1.2;flex:1;min-width:0}
.now .lt b{font-weight:400;color:var(--gold)}
.now .bar{margin-top:6px}
.queue{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.queue .qi{display:flex;align-items:center;gap:6px;font-size:12px;color:#ddd}
.queue .qi .x{margin-left:auto;cursor:pointer;color:#c55;padding:0 4px}
.sessionloot{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;min-height:280px;max-height:46vh;background:rgba(0,0,0,.45);border:1px solid #2a2016;border-radius:3px}
.chat .msgs{flex:1;overflow-y:auto;padding:6px 8px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.35;text-shadow:0 1px 1px #000}
.chat .msgs div{margin:1px 0;word-wrap:break-word}
.chat .in{display:flex;border-top:1px solid #2a2016}
.chat .in input{flex:1;background:rgba(0,0,0,.5);border:0;color:#fff;padding:8px;font:13px Arial,sans-serif;outline:none}
.c-sys{color:#ffff00}.c-skill{color:#5555ff}.c-loot{color:#00aa00}.c-guild{color:#40ff40}.c-trade{color:#ffc0c0}.c-gen{color:#ffc0c0}
.c-whisper{color:#ff80ff}.c-yell{color:#ff4040}.c-emote{color:#ff8040}.c-ach{color:#ffff00}.c-craft{color:#00aa00}.c-raid{color:#ff4800}
.c-skill{color:#6a6aff}
.chat .msgs .x2{color:#aaa;font-size:11px}
.chat a.ilink{cursor:pointer;text-decoration:none}

/* ---------- Tooltip (GameTooltip) ---------- */
.tip{position:fixed;z-index:100;pointer-events:none;max-width:320px;min-width:200px;padding:8px 10px;font-size:13px;line-height:1.38;
  background:rgba(4,4,24,.94);border:1px solid #c8c8d8;border-radius:5px;box-shadow:0 0 0 1px #000, inset 0 0 0 1px #3b3b55, 0 4px 18px #000c}
.tip .tn{font-size:15px;margin-bottom:1px}
.tip .wh{color:#fff}.tip .gr{color:#1eff00}.tip .ye{color:#ffd100}.tip .gy{color:#9d9d9d}.tip .rd{color:#ff2020}
.tip .flav{color:#ffd100;font-style:italic}
.ttbox{background:rgba(4,4,24,.94);border:1px solid #c8c8d8;border-radius:5px;padding:10px 12px;box-shadow:inset 0 0 0 1px #3b3b55}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:14px}
.modal .frame{width:min(520px,100%);max-height:88vh;overflow:auto}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qtyrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.qtyrow input{width:84px}

/* ---------- Toasts / raid warning / achievement ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ach{pointer-events:auto;display:flex;align-items:center;gap:12px;min-width:300px;max-width:92vw;padding:10px 16px 10px 10px;border-radius:6px;
  background:linear-gradient(180deg,#2b2b2b,#0d0d0d);border:2px solid #9a7a30;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #e9c86a55,0 0 24px rgba(255,200,80,.25);animation:pop .4s ease-out}
.ach .h{font-size:11px;letter-spacing:2px;color:#d4b25d;text-transform:uppercase}
.ach .n{font-size:16px;color:#fff}
.ach .pts{margin-left:auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 15px var(--num);color:#fff;
  background:radial-gradient(circle at 40% 35%,#e9c86a,#7d5a14);box-shadow:0 0 0 2px #000,inset 0 0 6px #000a}
.lootbox{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:4px;background:rgba(0,0,0,.82);border:1px solid #555;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#raidwarn{position:fixed;top:22%;left:0;right:0;text-align:center;z-index:95;pointer-events:none;font:700 26px var(--ui);color:#ff4800;text-shadow:0 2px 2px #000,0 0 10px #000;padding:0 20px}
#raidwarn.on{animation:rw 4.5s ease-out forwards}
@keyframes rw{0%{opacity:0;transform:scale(1.3)}8%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* ---------- Login / loading ---------- */
.screen{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;
  background:radial-gradient(ellipse at 50% 30%, rgba(80,40,120,.45), transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(30,110,90,.25), transparent 55%), #050307}
.bigtitle{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(34px,8vw,64px);letter-spacing:2px;text-align:center;line-height:1;
  background:linear-gradient(180deg,#fff6c4 0%,#f6c843 40%,#a86d0c 58%,#ffe58a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 18px rgba(255,150,30,.35))}
.subtitle{font-family:'Cinzel',serif;color:#cfd8ff;letter-spacing:6px;font-size:clamp(11px,2.6vw,15px);margin-top:8px;text-align:center;text-shadow:0 0 10px #6a5cff}
.loginbox{margin-top:30px;width:min(360px,100%)}
.loginbox label{display:block;color:var(--gold);font-size:13px;margin:10px 0 4px;text-shadow:0 1px 1px #000}
.loginbox input{width:100%}
.realm{margin-top:18px;font-size:12px;color:#8b8fb0;text-align:center}
.legal{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10.5px;color:#6b6475;padding:0 12px}
.loadbar{width:min(520px,90%);margin-top:30px}
.loadtip{margin-top:14px;max-width:560px;text-align:center;color:#ffd100;font-size:14px;text-shadow:0 1px 2px #000}

/* ---------- Achievements ---------- */
.achrow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #2c2216;border-radius:4px;background:linear-gradient(180deg,#1b1611,#100c08);margin-bottom:6px}
.achrow.got{border-color:#7d6122;background:linear-gradient(180deg,#2c2312,#15100a)}
.achrow .grow{flex:1;min-width:0}
.achrow .an{font-size:14.5px}.achrow .ad{font-size:12px;color:#a89a85}
.achrow:not(.got) .ic img{filter:grayscale(1) brightness(.45)}
.achrow .ap{font:700 14px var(--num);color:#ffd100;min-width:26px;text-align:center}
.achrow .when{font-size:10.5px;color:#7f7260}

@media (max-width: 900px){
  .layout{grid-template-columns:1fr;padding:8px;gap:8px}
  #side{order:-1}
  #side .chatwrap{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:25;padding:0 6px}
  #side .chatwrap .chat{min-height:0;max-height:none;height:118px;background:rgba(0,0,0,.82)}
  #side .chatwrap.big .chat{height:52vh}
  #main{margin-bottom:170px}
  .tab{padding:7px 9px;font-size:12px}
  nav.tabs .tab span.lab{display:none}
  nav.tabs .tab .ic{width:26px;height:26px}
  nav.tabs{justify-content:space-around}
  .two{grid-template-columns:1fr}
  .top{padding:6px 10px;gap:8px}.logo{font-size:15px;max-width:9.5em}.logo small{display:none}.who .tt{display:none}.who .nm{font-size:13px}
  .now.frame{padding:0}
  #toasts{bottom:190px}
}
</style>
</head>
<body>
<div id="login" class="screen">
  <div class="bigtitle">SHATTRATH TRADE</div>
  <div class="subtitle">AN OUTLAND PROFESSIONS IDLE · PATCH 2.4.3</div>
  <div class="loginbox frame"><div class="fbody">
    <label>Character Name</label><input id="lgName" class="inp" maxlength="12" autocomplete="off" placeholder="Thrall">
    <div id="lgOnline">
      <label>Guild Code <span class="muted small">(same code for you and your friend)</span></label><input id="lgGuild" class="inp" maxlength="24" autocomplete="off" placeholder="e.g. ScryersOfMagenta">
      <label>PIN <span class="muted small">(protects your character)</span></label><input id="lgPin" class="inp" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn big" id="lgGo">Enter World</button></div>
    <div id="lgErr" class="red small" style="text-align:center;margin-top:8px"></div>
    <div class="realm" id="lgRealm"></div>
  </div></div>
  <div class="legal">Fan-made, non-commercial. World of Warcraft, item names and icons © Blizzard Entertainment. Icons served by Wowhead.</div>
</div>
<div id="loading" class="screen hidden">
  <div class="bigtitle" style="font-size:clamp(28px,6vw,46px)">SHATTRATH CITY</div>
  <div class="subtitle">TEROKKAR FOREST</div>
  <div class="loadbar bar"><div class="fill" id="ldFill"></div></div>
  <div class="loadtip" id="ldTip"></div>
</div>

  RECIPES.push({p:'jewelcrafting', o:'Prospecting: ' + ore, icon:'inv_misc_gem_bloodgem_01', pros:ore, q:0, m:{[ore]:5}, s:p.s, t:2});
RECIPES.forEach(r => { r.id = r.p + ':' + r.o; });
const RBYID = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const RBYITEM = {}; RECIPES.forEach(r => { if (r.ri) RBYITEM[r.ri] = r; });
const ALLSPOTS = {}; for (const [k, list] of Object.entries(SPOTS)) list.forEach(s => { s.k = k; s.t = Math.round(s.t * (k === 'combat' ? 1.5 : 1.8)); if (s.coin) s.coin = s.coin.map(c => Math.round(c * .6)); ALLSPOTS[k + ':' + s.id] = s; });
const DIFF = ['optimal (orange)', 'medium (yellow)', 'easy (green)', 'trivial (gray)'];
const diff = (s, a) => s < a[1] ? 0 : s < a[2] ? 1 : s < a[3] ? 2 : 3;
const gArr = req => [req, req + 25, req + 50, req + 100];

// ---------- Globals ----------
let ST = null;          // player state
let G = {members:{}, bank:{}, project:{phase:0, got:{}}, market:{}};
let NET = null, VIEW = 'gather', SUB = {}, SEL = {}, SESSION = {}, DIRTY = true, LAST_RENDER = 0, MURLOC_UNTIL = 0;
let PID = '', GUILD = '', GUILDNAME = '', MYSID = '', LOCKED = false;

function newState(name){
  return {v:VERSION, name, created:now(), t:now(), gold:10*1e4, profs:{}, inv:{'Hearthstone':1}, act:null, q:[], cs:0, cn:0, cq:null,
    cds:{}, riding:0, known:{}, spec:{}, st:{gathers:0,crafts:0,sold:0,prospects:0,de:0,comms:0,ninja:0,gank:0,dep:0,booms:0,earned:0,rares:0,procs:0,kills:0,hogger:0,crash:0},
    made:{}, found:{}, ach:{}, rep:0, keys:{}, comm:[], commSlot:0, buffs:{}, flags:{}, played:0, title:''};
}

// ---------- Guild buffs ----------
function guildBuff(k){ let v = 0; const ph = G.project?.phase || 0; for (let i = 0; i < ph && i < PHASES.length; i++) v += PHASES[i].buff[k] || 0; return v; }
function mountTier(st){ let t = st.riding; for (const [n, tier] of Object.entries(MOUNT_ITEMS)) if (st.inv[n] > 0) t = Math.max(t, tier); return t; }
const canFly = st => mountTier(st) >= 3;
function speedMult(st, t){ let m = RIDING[mountTier(st)].mult; let b = 1 + guildBuff('gather'); if ((st.buffs.pinchy || 0) > t) b += .25; return m * b; }
const gatherDur = (st, sp, t) => sp.t * 1000 / speedMult(st, t);
const craftDur = r => r.t * 1000 / (1 + guildBuff('craft'));
function rankOf(m){ return RANKS.findIndex(r => r.max === m); }
function isDarkmoon(d = new Date()){ return d.getDate() <= 7; }

// ---------- Recipe helpers ----------
function knows(st, r){
  const pr = st.profs[r.p]; if (!pr) return false;
  if (r.src) return !!st.known[r.id];
  return pr.s >= r.s[0];
}
function cdLeft(st, r, t){ return r.cdk ? Math.max(0, (st.cds[r.cdk] || 0) - t) : 0; }
function maxCraft(st, r){ let n = Infinity; for (const [m, q] of Object.entries(r.m)) n = Math.min(n, Math.floor((st.inv[m] || 0) / q)); return n; }
function canCraft(st, r, t){ return knows(st, r) && maxCraft(st, r) > 0 && !cdLeft(st, r, t); }
function spotOk(st, sp){
  if (sp.k === 'combat') return sp.key ? !!st.keys[sp.key] : true;
  const pr = st.profs[sp.k]; if (!pr || pr.s < sp.req) return false;
  if (sp.flying && !canFly(st)) return false; return true;
}

// ---------- Engine ----------
function newOut(live){ return {live, items:{}, gold:0, skill:{}, made:{}, notable:[], ev:{gank:0,ninja:0,rich:0,boom:0,procs:0,hogger:0}, msgs:[]}; }
function msg(out, cls, html, key){ if (out.live) chat(cls, html, key); }
function give(st, n, q, out){
  if (q <= 0) return; st.inv[n] = (st.inv[n] || 0) + q; out.items[n] = (out.items[n] || 0) + q;
  st.found[n] = (st.found[n] || 0) + q;
  if (isNotable(n)) { out.notable.push(n); st.st.rares++; }
  if (out.live) SESSION[n] = (SESSION[n] || 0) + q;
}
function take(st, n, q){ st.inv[n] = (st.inv[n] || 0) - q; if (st.inv[n] <= 0) delete st.inv[n]; }
const NOTABLE = new Set(['Black Lotus','Fel Lotus','Netherwing Egg','Mr. Pinchy','Old Crafty','Old Ironjaw','Primal Nether','Nether Vortex','Khorium Ore','Arcane Crystal']);
const RAIDWARN = new Set(['Black Lotus','Mr. Pinchy',"Ashes of Al'ar","Fiery Warhorse's Reins",'Reins of the Raven Lord','Plans: Lionheart Champion','Old Crafty','Old Ironjaw','Netherwing Egg','Formula: Enchant Weapon - Mongoose']);
function isNotable(n){ return NOTABLE.has(n) || I(n).q >= 3 || RBYITEM[n] || MOUNT_ITEMS[n]; }

function skillUp(st, p, arr, out){
  const pr = st.profs[p]; if (!pr || pr.s >= pr.m) return;
  const d = diff(pr.s, arr); if (d === 3) return;
  const ch = d === 0 ? 1 : (arr[3] - pr.s) / (arr[3] - arr[1]) * (PROFS[p].kind === 'gather' ? .7 : 1);
  if (Math.random() < ch) { pr.s++; out.skill[p] = pr.s; msg(out, 'c-skill', `Your skill in ${PROFS[p].n} has increased to ${pr.s}.`); }
}

function doGather(st, t, out){
  const a = st.act, sp = ALLSPOTS[a.k + ':' + a.id]; if (!sp) { st.act = null; return 0; }
  st.st.gathers++;
  if (a.k === 'combat') return doCombat(st, sp, t, out);
  const r = Math.random();
  if (sp.outland && r < .01) {
    st.st.gank++; out.ev.gank++;
    msg(out, 'c-sys', `You have been slain by <span class="c-yell">${pick(['Stabbystab','Ganklord','Shadowmeldz','Rogueishard'])}</span> (Rogue, level ??). You release your spirit and run back from the graveyard.`);
    return 45e3;
  }
  if (a.k === 'herbalism' && sp.outland && r < .06) {
    st.st.ninja++; out.ev.ninja++;
    msg(out, 'c-emote', `A druid in Flight Form swoops down and snatches the ${sp.n} right in front of you!`);
    return 0;
  }
  const rich = a.k === 'mining' && r > .92;
  if (rich) { out.ev.rich++; msg(out, 'c-sys', `Rich ${sp.n.replace(/(Vein|Deposit)/, '$1')}! Double yield.`); }
  if (sp.z === 'Elwynn Forest' && Math.random() < .0008) {
    st.st.hogger++; out.ev.hogger++; st.gold += 250; out.gold += 250;
    msg(out, 'c-yell', 'Hogger yells: Grrr... fresh meat! <span class="c-sys">You help the Stormwind guards drive Hogger back into the woods.</span>');
  }
  skillUp(st, a.k, gArr(sp.req), out);
  sp.drops.forEach(([n, mn, mx, c], i) => { if (Math.random() < c) { let q = rnd(mn, mx); if (rich && i === 0) q *= 2; give(st, n, q, out); lootMsg(out, n, q); } });
  return 0;
}
function lootMsg(out, n, q){ if (out.live) chat('c-loot', `You receive loot: ${ilink(n)}${q > 1 ? 'x' + q : ''}.`, 'loot:' + n); if (out.live && RAIDWARN.has(n)) raidWarn(`${n}!`); }
function doCombat(st, sp, t, out){
  st.st.kills++;
  const c = rnd(sp.coin[0], sp.coin[1]); st.gold += c; out.gold += c; st.st.earned += c;
  sp.drops.forEach(([n, mn, mx, ch]) => { if (Math.random() < ch) { const q = rnd(mn, mx); give(st, n, q, out); lootMsg(out, n, q); } });
  if (Math.random() < (sp.gc || 0)) { const n = pick(GREENS[sp.green]); give(st, n, 1, out); lootMsg(out, n, 1); }
  if (Math.random() < (sp.bc || 0)) { const n = pick(GREENS.blue); give(st, n, 1, out); lootMsg(out, n, 1); }
  if (Math.random() < (sp.ec || 0)) { const n = pick(sp.epics || GREENS.epic); give(st, n, 1, out); lootMsg(out, n, 1); }
  (sp.recipes || []).forEach(([n, ch]) => { if (Math.random() < ch) { give(st, n, 1, out); lootMsg(out, n, 1); } });
  return 0;
}

function tryStartCraft(st, t, out){
  if (st.cs) return;
  for (const e of st.q) {
    const r = RBYID[e.id]; if (!r) continue;
    if (canCraft(st, r, t)) {
      st.cs = t; st.cn = t + craftDur(r); st.cq = r.id;
      if (r.cdk) st.cds[r.cdk] = t + r.cd * H * (1 - guildBuff('cd'));
      return;
    }
  }
}
function completeCraft(st, t, out){
  const r = RBYID[st.cq]; st.cs = 0; const e = st.q.find(x => x.id === st.cq); st.cq = null;
  if (!r) return;
  if (maxCraft(st, r) < 1) return;
  for (const [m, q] of Object.entries(r.m)) take(st, m, q);
  if (e && e.n > 0) { e.n--; if (e.n === 0) st.q.splice(st.q.indexOf(e), 1); }
  st.st.crafts++;
  if (r.boom && Math.random() < .03) {
    st.st.booms++; out.ev.boom++;
    msg(out, 'c-emote', `The ${r.o} explodes in your face! Your eyebrows will grow back. Eventually.`);
    skillUp(st, r.p, r.s, out); return;
  }
  if (r.pros) {
    st.st.prospects++;
    const tab = PROSPECT[r.pros].g; let got = 0;
    for (const [n, ch] of tab) if (Math.random() < ch) { const q = n === 'Adamantite Powder' ? rnd(1, 2) : 1; give(st, n, q, out); if (n !== 'Adamantite Powder') got++; lootMsg(out, n, q); }
    if (!got) { const tot = tab.reduce((a, b) => a + (b[0] === 'Adamantite Powder' ? 0 : b[1]), 0); let x = Math.random() * tot; for (const [n, ch] of tab) { if (n === 'Adamantite Powder') continue; x -= ch; if (x <= 0) { give(st, n, 1, out); lootMsg(out, n, 1); break; } } }
  } else {
    let q = r.q;
    if (r.spec && st.spec[r.p] === r.spec && Math.random() < .15) {
      const extra = 1 + (Math.random() < .25 ? 1 : 0) + (Math.random() < .08 ? 2 : 0); q += extra; st.st.procs++; out.ev.procs++;
      msg(out, 'c-sys', `Your ${SPECS[r.spec].n} mastery creates ${extra} extra ${ilink(r.o)}!`);
      if (r.spec === 'transmute') st.flags.tproc = 1;
    }
    if (Math.random() < guildBuff('proc')) { q++; msg(out, 'c-sys', `The Anvil of the Shattered Sun blesses your work: +1 ${ilink(r.o)}.`); }
    give(st, r.o, q, out); st.made[r.o] = (st.made[r.o] || 0) + q; out.made[r.o] = (out.made[r.o] || 0) + q;
    if (out.live) chat('c-craft', `You create: ${ilink(r.o)}${q > 1 ? 'x' + q : ''}.`, 'craft:' + r.o);
    if (out.live && I(r.o).q >= 4) raidWarn(`${r.o} crafted!`);
  }
  skillUp(st, r.p, r.s, out);
}
const SPECS = {transmute:{n:'Transmutation', d:'15% chance to create extra Primal Might, diamonds and other transmutes.'}, elixir:{n:'Elixir', d:'15% chance to create extra elixirs and flasks.'}, potion:{n:'Potion', d:'15% chance to create extra potions.'}};

function advance(st, until, out){
  let t = st.t;
  if (until - t > CAP_OFFLINE) {
    t = until - CAP_OFFLINE;
    if (st.act && st.act.nx < t) { st.act.s0 = t; st.act.nx = t + 1000; }
    if (st.cs && st.cn < t) st.cn = t;
  }
  let guard = 0;
  while (guard++ < 400000) {
    const tg = st.act ? st.act.nx : Infinity, tc = st.cs ? st.cn : Infinity, nt = Math.min(tg, tc);
    if (nt > until) break;
    if (tc <= tg) { completeCraft(st, tc, out); tryStartCraft(st, tc, out); }
    else {
      const pen = doGather(st, tg, out);
      if (st.act) { const sp = ALLSPOTS[st.act.k + ':' + st.act.id]; st.act.s0 = tg; st.act.nx = tg + pen + gatherDur(st, sp, tg); }
      if (!st.cs) tryStartCraft(st, tg, out);
    }
  }
  if (!st.cs) tryStartCraft(st, until, out);
  st.t = until;
  genComms(st, until, out.live);
}

// ---------- Trade chat commissions ----------
const SLOT = 40 * MIN;
function commPool(st){
  const pool = new Set();
  for (const sp of Object.values(ALLSPOTS)) if (sp.k !== 'combat' && spotOk(st, sp)) pool.add(sp.drops[0][0]);
  for (const r of RECIPES) if (!r.pros && knows(st, r) && !NOAH.has(r.o) && !r.mount) pool.add(r.o);
  if (!pool.size) ['Linen Cloth','Copper Ore','Peacebloom','Light Leather','Netherweave Cloth'].forEach(n => pool.add(n));
  return [...pool];
}
function genComms(st, until, live){
  st.comm = st.comm.filter(c => c.exp > until);
  const cur = Math.floor(until / SLOT); const from = Math.max((st.commSlot || 0) + 1, cur - 12);
  for (let k = from; k <= cur; k++) {
    const R_ = rng32(hashStr(st.name + ':' + k));
    if (R_() > .72 || st.comm.length >= 4) continue;
    const pool = commPool(st); const item = pool[Math.floor(R_() * pool.length)];
    const base = basePrice(item); if (!base) continue;
    const target = (8 + R_() * 70) * 1e4 * (base > 30e4 ? 3 : 1);
    const qty = clamp(Math.round(target / base), 1, 60);
    const pay = Math.round(qty * base * (1.6 + R_() * 1.1) * (1 + guildBuff('tips')));
    const who = NPCS[Math.floor(R_() * NPCS.length)];
    const tpl = Math.floor(R_() * 4);
    const c = {id:k, who, item, qty, pay, exp:k * SLOT + 10 * H, tpl};
    if (c.exp <= until) continue;
    st.comm.push(c);
    if (live) chat('c-trade', `[2. Trade] [${who}]: ${commText(c)}`, null, `<button class="btn sm" data-a="fulfill" data-id="${k}">Sell</button>`);
  }
  st.commSlot = cur;
}
function commText(c){
  const L = `${ilink(c.item)}${c.qty > 1 ? 'x' + c.qty : ''}`;
  return [`WTB ${L}, paying ${money(c.pay)} total, PST!`, `LF someone to supply ${L} — tipping ${money(c.pay)}`, `Need ${L} for raid tonight, ${money(c.pay)} on the table`, `anyone selling ${L}? ${money(c.pay)}, mail me plz`][c.tpl];
}

// ---------- Market (shared between guildmates) ----------
function basePrice(n){
  if (PRICES[n] != null) return PRICES[n];
  const it = I(n); if (!it) return 0;
  if (it.sl) return Math.round(it.s * 1.5);
  return Math.max(5, it.s * 4);
}
const tradeable = n => !NOAH.has(n) && !RBYITEM[n] && n !== 'Hearthstone' && basePrice(n) > 0 && I(n).q < 5;
const liq = n => 3e6 / (basePrice(n) + 2e4) + 4;
function wave(n, t){ const h = hashStr(n); return 1 + .12 * Math.sin(2 * Math.PI * t / (26 * H) + (h % 628) / 100) + .06 * Math.sin(2 * Math.PI * t / (7.3 * H) + (h % 314) / 50); }
function pressure(n, t){ const m = G.market[mkey(n)]; if (!m) return 0; return m.p * Math.pow(.5, (t - m.t) / (8 * H)); }
const mkey = n => encodeURIComponent(n).replace(/\./g, '%2E');
function unitPrice(n, t = now()){ return basePrice(n) * wave(n, t) * Math.exp(-pressure(n, t)); }
function sellValue(n, q, t = now()){ const L = liq(n), u = unitPrice(n, t); return Math.floor(u * (1 - Math.exp(-q / L)) / (1 - Math.exp(-1 / L)) * .95 * (isDarkmoon() ? 1.1 : 1)); }
function buyCost(n, q, t = now()){ const L = liq(n), u = unitPrice(n, t) * 1.05; return Math.ceil(u * (Math.exp(q / L) - 1) / (Math.exp(1 / L) - 1)); }
function trend(n){ const t = now(), a = unitPrice(n, t), b = basePrice(n) * wave(n, t - H) * Math.exp(-pressure(n, t - H)); return a > b * 1.005 ? 1 : a < b * .995 ? -1 : 0; }

// ---------- Networking: local (solo) + Firebase (co-op) ----------
function fhash(pin){ return 'h' + hashStr('shattrath:' + pin + ':sunwell').toString(36) + hashStr(pin + 'kael').toString(36); }
class LocalNet {
  constructor(){ this.mode = 'local'; this.L = {}; try { this.db = JSON.parse(localStorage.getItem('shattrath_local') || 'null'); } catch(e) {} this.db = this.db || {saves:{}, members:{}, bank:{}, market:{}, project:{phase:0, got:{}}, chat:[]}; }
  persist(){ try { localStorage.setItem('shattrath_local', JSON.stringify(this.db)); } catch(e) {} }
  emit(k){ (this.L[k] || []).forEach(cb => cb(k === 'chat' ? null : this.db[k])); }
  on(k, cb){ (this.L[k] = this.L[k] || []).push(cb); if (k !== 'chat') cb(this.db[k]); }
  async init(){}
  async login(g, name, pin){ const v = this.db.saves[slug(name)]; if (!v) return null; if (v.pin && v.pin !== fhash(pin)) throw new Error('Wrong PIN for this character.'); return JSON.parse(v.save); }
  async save(st, sum, pin){ this.db.saves[PID] = {save:JSON.stringify(st), pin:fhash(pin)}; this.db.members[PID] = sum; this.persist(); this.emit('members'); }
  async claim(){} onSession(){}
  async bankTx(n, d){ const k = mkey(n), v = (this.db.bank[k] || 0) + d; if (v < 0) return false; if (v) this.db.bank[k] = v; else delete this.db.bank[k]; this.persist(); this.emit('bank'); return true; }
  async market(n, dp){ const k = mkey(n), t = now(); const p = clamp(pressure(n, t) + dp, -3, 6); this.db.market[k] = {p, t}; this.persist(); this.emit('market'); }
  async project(n, q){ const res = applyProject(this.db.project, n, q); this.persist(); this.emit('project'); return res; }
  async chat(m){ m.ts = now(); this.db.chat.push(m); this.db.chat = this.db.chat.slice(-60); this.persist(); (this.L.chatAdd || []).forEach(cb => cb(m)); }
  onChat(cb){ (this.L.chatAdd = this.L.chatAdd || []).push(cb); this.db.chat.forEach(cb); }
}
function applyProject(cur, n, q){
  cur.got = cur.got || {}; const ph = PHASES[cur.phase || 0]; if (!ph) return 0;
  const need = ph.need[n] || 0, k = mkey(n), got = cur.got[k] || 0, acc = Math.max(0, Math.min(q, need - got));
  if (!acc) return 0; cur.got[k] = got + acc;
  if (Object.entries(ph.need).every(([x, v]) => (cur.got[mkey(x)] || 0) >= v)) { cur.done = cur.done || {}; cur.done[cur.phase || 0] = now(); cur.phase = (cur.phase || 0) + 1; cur.got = {}; }
  return acc;
}
class FireNet {
  constructor(cfg){ this.mode = 'firebase'; this.cfg = cfg; }
  async init(){
    const V = '10.12.2';
    const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    this.D = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
    this.app = A.initializeApp(this.cfg); this.db = this.D.getDatabase(this.app);
  }
  r(p){ return this.D.ref(this.db, p ? `guilds/${GUILD}/${p}` : `guilds/${GUILD}`); }
  async login(g, name, pin){ const s = await this.D.get(this.r('saves/' + slug(name))); if (!s.exists()) return null; const v = s.val(); if (v.pin && v.pin !== fhash(pin)) throw new Error('Wrong PIN for this character.'); return v.save ? JSON.parse(v.save) : null; }
  async save(st, sum, pin){ await this.D.update(this.r(''), {[`saves/${PID}/save`]:JSON.stringify(st), [`saves/${PID}/pin`]:fhash(pin), [`members/${PID}`]:sum}); }
  async claim(sid){ await this.D.set(this.r(`saves/${PID}/sid`), sid); }
  onSession(cb){ this.D.onValue(this.r(`saves/${PID}/sid`), s => cb(s.val())); }
  on(k, cb){ this.D.onValue(this.r(k), s => cb(s.val() || (k === 'project' ? {phase:0, got:{}} : {}))); }
  async bankTx(n, d){ const res = await this.D.runTransaction(this.r('bank/' + mkey(n)), cur => { const v = (cur || 0) + d; if (v < 0) return; return v || null; }); return res.committed; }
  async market(n, dp){ const t = now(); await this.D.runTransaction(this.r('market/' + mkey(n)), cur => { const p0 = cur ? cur.p * Math.pow(.5, (t - cur.t) / (8 * H)) : 0; return {p:clamp(p0 + dp, -3, 6), t}; }); }
  async project(n, q){ let acc = 0; await this.D.runTransaction(this.r('project'), cur => { cur = cur || {phase:0, got:{}}; acc = applyProject(cur, n, q); return cur; }); return acc; }
  async chat(m){ m.ts = now(); await this.D.push(this.r('chat'), m); }
  onChat(cb){ this.D.onChildAdded(this.D.query(this.r('chat'), this.D.limitToLast(40)), s => cb(s.val())); }
}

// ---------- Chat ----------
const CHAT = [];
function chat(cls, html, key, extra){
  const box = $('#msgs'); if (!box) return;
  const last = box.lastElementChild;
  if (key && last && last.dataset.key === key) { const n = (+last.dataset.n || 1) + 1; last.dataset.n = n; let x = last.querySelector('.x2'); if (!x) { x = document.createElement('span'); x.className = 'x2'; last.appendChild(x); } x.textContent = ` (x${n})`; return; }
  const d = document.createElement('div'); d.className = cls; if (key) d.dataset.key = key;
  d.innerHTML = html + (extra ? ' ' + extra : '');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.appendChild(d); while (box.children.length > 150) box.firstChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}
function guildMsg(m){
  const mine = m.pid === PID;
  if (m.type === 'say') chat('c-guild', `[Guild] [<span class="link" data-a="who" data-pid="${esc(m.pid)}">${esc(m.name)}</span>]: ${linkify(esc(m.txt))}`);
  else if (m.type === 'ach') chat('c-ach', `${mine ? 'You have' : '[' + esc(m.name) + '] has'} earned the achievement <span class="link" data-a="feats">[${esc(m.txt)}]</span>!`);
  else if (m.type === 'loot' && !mine) chat('c-guild', `[Guild] ${esc(m.name)} has found ${ilink(m.txt)}!`);
  else if (m.type === 'sys') chat('c-sys', esc(m.txt));

let PIN = '';
function summary(){
  const sp = ST.act ? ALLSPOTS[ST.act.k + ':' + ST.act.id] : null;
  const pts = ACH.filter(a => ST.ach[a.id]).reduce((s, a) => s + achPts(a), 0);
  return {name:ST.name, title:ST.title || '', profs:Object.fromEntries(Object.entries(ST.profs).map(([p, v]) => [p, v.s])), act: sp ? `${sp.k === 'combat' ? 'Fighting' : PROFS[sp.k].verb}: ${sp.n} (${sp.z})` : 'Idle in Shattrath', craft: ST.cq ? RBYID[ST.cq]?.o || '' : '', seen:now(), pts, gold:ST.gold, rep:ST.rep};
}
async function saveNow(){
  if (!ST || LOCKED) return;
  try { localStorage.setItem('shattrath_cache_' + GUILD + '_' + PID, JSON.stringify(ST)); } catch(e) {}
  try { await NET.save(ST, summary(), PIN); } catch(e) { console.warn('save failed', e); }
}

const A = {

    chat('c-sys', `You begin ${sp.k === 'combat' ? 'fighting' : PROFS[sp.k].verb.toLowerCase()} at ${esc(sp.n)}, ${esc(sp.z)}.`);
  },
  stop(){ tick(); ST.act = null; },
  selr(d){ SEL.recipe = d.id; },
  queue(d){
    const r = RBYID[d.id]; let n = d.n === 'all' ? maxCraft(ST, r) : d.n === 'inf' ? -1 : +d.n;
    if (d.n === 'custom') n = Math.max(1, +($('#qtyIn')?.value || 1));
    if (!n) return; tick();
    const e = ST.q.find(x => x.id === r.id);
    if (e) e.n = (n === -1 || e.n === -1) ? -1 : e.n + n; else ST.q.push({id:r.id, n});
    tryStartCraft(ST, now(), newOut(true));

    const p = d.p; if (ST.profs[p]) return;

  },
  train(d){ const pr = ST.profs[d.p]; const nx = RANKS[rankOf(pr.m) + 1]; if (!nx || pr.s < nx.req || ST.gold < nx.cost) return; ST.gold -= nx.cost; pr.m = nx.max; chat('c-sys', `You have learned ${nx.n} ${PROFS[d.p].n}. Maximum skill is now ${nx.max}.`); },

  unlearn2(d){ delete ST.profs[d.p]; RECIPES.filter(r => r.p === d.p).forEach(r => delete ST.known[r.id]); if (ST.act?.k === d.p) ST.act = null; ST.q = ST.q.filter(e => RBYID[e.id]?.p !== d.p); if (ST.cq && RBYID[ST.cq]?.p === d.p) { ST.cs = 0; ST.cq = null; } A.close(); },
  spec(d){ const cost = ST.spec.alchemy ? 1500000 : 0; if (ST.gold < cost) return; ST.gold -= cost; ST.spec.alchemy = d.s; chat('c-sys', `You are now a ${SPECS[d.s].n} Master.`); },

  buyrec(d){ const r = RBYID[d.id]; if (!r || ST.known[r.id] || ST.gold < r.cost || !ST.profs[r.p] || (r.rep && ST.rep < r.rep)) return; ST.gold -= r.cost; ST.known[r.id] = 1; chat('c-sys', `You have learned how to create a new item: ${ilink(r.o)}.`); },
  sell(d){
    const n = d.n, have = ST.inv[n] || 0; let q = d.q === 'all' ? have : Math.min(have, +d.q || +($('#qtyIn')?.value || 0)); if (q <= 0 || !tradeable(n)) return;

  },

// ---------- Main loop ----------
let lastTick = 0, lastSave = 0, nextAmbient = 0, nextSpam = 0;
function tick(){
  if (!ST || LOCKED) return;
  const t = now(); const out = newOut(true);
  ST.played += Math.min(t - (lastTick || t), 5000); lastTick = t;
  const inv0 = JSON.stringify(ST.inv).length;
  advance(ST, t, out);
  for (const n of out.notable) NET.chat({pid:PID, name:ST.name, type:'loot', txt:n});
  if (Object.keys(out.items).length || out.gold || Object.keys(out.skill).length) DIRTY = true;
}
function loop(){
  tick(); renderNow(); renderTop();
  const t = now();
  if (DIRTY && t - LAST_RENDER > 1500) render(false);
  if (t - lastSave > 15000) { lastSave = t; checkAch(true); saveNow(); }
  else if (t % 3000 < 260) checkAch(true);
  const hr = new Date().getHours(); if (hr >= 3 && hr < 5) ST.flags.night = 1;
  if (t > nextAmbient) { if (nextAmbient) { const [ch, txt] = pick(AMBIENT); const who = pick(NPCS); chat(ch === 'Trade' ? 'c-trade' : 'c-gen', `[${ch === 'Trade' ? '2. Trade' : '1. General'}] [${who}]: ${txt.includes('Thunderfury') ? txt.replace(/\[Thunderfury[^\]]*\]/, `<a class="ilink link tq5" data-a="thunderfury">[Thunderfury, Blessed Blade of the Windseeker]</a>`) : linkify(esc(txt))}`); } nextAmbient = t + rnd(70, 200) * 1000; }
  if (t > nextSpam) { if (nextSpam) { const id = rnd(1, 1e9); chat('c-whisper', `[${pick(['Xjkqzlw','Hfgoldvx','Qqwerzty','Lkjhgold'])}] whispers: ${esc(pick(GOLDSELLER))}`, null, `<button class="btn sm dark" data-a="report" data-id="${id}" data-rep="${id}">Report Spam</button>`); } nextSpam = t + rnd(9, 20) * MIN; }
}

// ---------- Slash commands & easter eggs ----------
function onChatInput(txt){
  txt = txt.trim(); if (!txt) return;
  if (txt[0] !== '/') { if (MURLOC_UNTIL > now()) txt = pick(['Mrgglglgl!','Mrrrggk!','Aaaaaughibbrgubugbugrguburgle!','Mmmrrglllm?']); NET.chat({pid:PID, name:ST.name, type:'say', txt}); return; }
  const [cmd, ...rest] = txt.slice(1).split(' '); const c = cmd.toLowerCase();
  const E = s => chat('c-emote', s);
  switch (c) {
    case 'help': chat('c-sys', 'Commands: /roll, /played, /who, /dance, /cheer, /train, /chicken, /sit, /joke, /g &lt;msg&gt; ... and a few you will have to find yourself.'); break;
    case 'roll': { const r = rnd(1, 100); NET.chat({pid:PID, name:ST.name, type:'sys', txt:`${ST.name} rolls ${r} (1-100)`}); if (r === 100) ST.flags.roll100 = 1; break; }
    case 'played': chat('c-sys', `Total time played: ${fmtDur(ST.played)}. Time your character has been working in Outland: ${fmtDur(now() - ST.created)}.`); break;
    case 'who': chat('c-sys', Object.values(G.members).map(m => `${m.name}${online(m) ? ' (online)' : ''}`).join(', ') + ` — ${Object.keys(G.members).length} player(s) total`); break;
    case 'dance': E('You burst into dance.'); break;
    case 'cheer': E('You cheer!'); break;
    case 'train': E('You let off a train whistle. Choo Choo!'); break;
    case 'chicken': E('With arms flapping, you strut around. Cluck, Cluck, Chicken.'); break;
    case 'sit': E('You sit down.'); break;
    case 'joke': E(pick(['You tell a joke: "Why did the gnome cross the road? To get to the other... wait, where did the road go?"', 'You tell a joke: "What do you call a rogue with no stealth? Dead."', 'You tell a joke: "How many paladins does it take to change a light bulb? None, they just bubble and hearth."'])); break;
    case 'leeroy': case 'leroy': chat('c-yell', `${esc(ST.name)} yells: LEEEEEEEEEEEEROOOOOOOOOOY JENKINS!`); setTimeout(() => chat('c-emote', '...at least you have chicken.'), 1500); ST.flags.leeroy = 1; break;
    case 'dkp': chat('c-raid', '[Raid Leader]: FIFTY DKP MINUS! FIFTY DKP MINUS!'); raidWarn('50 DKP MINUS!'); ST.flags.dkp = 1; break;
    case 'moredots': chat('c-raid', '[Raid Leader]: MORE DOTS! MORE DOTS!'); raidWarn('MORE DOTS!'); break;
    case 'g': case 'gu': NET.chat({pid:PID, name:ST.name, type:'say', txt:rest.join(' ')}); break;
    case 'reload': location.reload(); break;
    default: chat('c-sys', `Unknown command: ${esc(cmd)}. Type /help.`);
  }
  checkAch(true); DIRTY = true;
}
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a']; let kpos = 0;
document.addEventListener('keydown', e => {
  kpos = e.key === KONAMI[kpos] ? kpos + 1 : (e.key === KONAMI[0] ? 1 : 0);
  if (kpos === KONAMI.length && ST) { kpos = 0; ST.flags.konami = 1; MURLOC_UNTIL = now() + 2 * MIN; if (!ST.inv['Murloc Costume']) give(ST, 'Murloc Costume', 1, newOut(false)); raidWarn('Mrgglglglgl!'); chat('c-yell', 'A murloc yells: Aaaaaughibbrgubugbugrguburgle! <span class="c-sys">You receive item: [Murloc Costume].</span>'); checkAch(true); DIRTY = true; }
  if (e.key === 'Escape') A.close();
});
let pokes = [];
function seasonal(){
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate(), y = d.getFullYear();
  const wv = (m === 12 && day >= 15) || (m === 1 && day <= 2);
  if (wv) { const key = 'wv' + (m === 1 ? y - 1 : y); if (!ST.flags[key]) { ST.flags[key] = 1; give(ST, 'Smokywood Pastures Gift Pack', 1, newOut(false)); chat('c-sys', `Feast of Winter Veil! Greatfather Winter left a ${ilink('Smokywood Pastures Gift Pack')} in your bags.`); } }
  if ((m === 10 && day >= 18) || (m === 11 && day === 1)) { const key = 'he' + y; if (!ST.flags[key]) { ST.flags[key] = 1; give(ST, 'Hallowed Wand - Pirate', 1, newOut(false)); chat('c-sys', `Hallow's End! The Headless Horseman rides tonight. You receive ${ilink('Hallowed Wand - Pirate')}. Arrr.`); } }
  if ((m === 9 && day >= 20) || (m === 10 && day <= 4)) chat('c-sys', 'Brewfest is on outside Ironforge and Orgrimmar. Watch out for Dark Iron dwarves stealing the kegs!');
  if (isDarkmoon()) chat('c-sys', "The Darkmoon Faire is in Terokkar Forest this week. Sayge's Fortune: +10% gold on Auction House sales.");
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el) { e.preventDefault(); const d = Object.assign({}, el.dataset); act(d.a, d); return; }
  if (e.target.id === 'modal') A.close();
});
document.addEventListener('input', e => { if (e.target.id === 'ahq') { SEL.ahq = e.target.value; clearTimeout(window._ahT); window._ahT = setTimeout(() => { render(true); const i = $('#ahq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); } });
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
if (fine) {
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-n]'); if (!el || el.closest('#modal')) { if (TIPEL) closeTip(); return; } if (el !== TIPEL) { TIPEL = el; const tp = $('#tip'); tp.innerHTML = tipHtml(el.dataset.n); tp.classList.remove('hidden'); } });
  document.addEventListener('mousemove', e => { if (!TIPEL) return; const tp = $('#tip'); const w = tp.offsetWidth, h = tp.offsetHeight; let x = e.clientX + 18, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = innerHeight - h - 8; tp.style.left = x + 'px'; tp.style.top = y + 'px'; });
}

// ---------- Boot ----------
async function boot(){
  const cfg = (window.SHATTRATH_CONFIG && window.SHATTRATH_CONFIG.firebase) || null;
  NET = cfg ? new FireNet(cfg) : new LocalNet();
  if (NET.mode === 'local') { $('#lgOnline').classList.add('hidden'); $('#lgRealm').textContent = 'Realm: Local (solo mode) — add a Firebase config to play with friends'; }
  else $('#lgRealm').textContent = 'Realm: Shattrath (PvE) — online';
  try { const last = JSON.parse(localStorage.getItem('shattrath_last') || 'null'); if (last) { $('#lgName').value = last.name || ''; $('#lgGuild').value = last.guild || ''; } } catch(e) {}
  $('#lgGo').onclick = login;
  ['lgName','lgGuild','lgPin'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
}
async function login(){
  const name = $('#lgName').value.trim(); const guild = $('#lgGuild').value.trim(); const pin = $('#lgPin').value;
  const err = t => { $('#lgErr').textContent = t; };
  if (!/^[A-Za-zÀ-ſ]{2,12}$/.test(name)) return err('Names must be 2-12 letters, no spaces or numbers.');
  if (NET.mode === 'firebase' && (slug(guild).length < 3 || pin.length < 3)) return err('Enter a guild code (3+ letters) and a PIN (3+ digits).');
  PID = slug(name); GUILD = NET.mode === 'firebase' ? slug(guild) : 'local'; GUILDNAME = guild.replace(/[<>]/g, ''); PIN = NET.mode === 'firebase' ? pin : '';
  $('#lgGo').disabled = true; err('');
  $('#login').classList.add('hidden'); $('#loading').classList.remove('hidden'); $('#ldTip').textContent = pick(TIPS); $('#ldFill').style.width = '20%';
  try {
    await NET.init(); $('#ldFill').style.width = '55%';
    let st = await NET.login(GUILD, name, pin);
    if (!st) { try { st = JSON.parse(localStorage.getItem('shattrath_cache_' + GUILD + '_' + PID) || 'null'); } catch(e) {} }
    const isNew = !st; if (!st) st = newState(name);
    ST = st; ST.name = name;
    ['st','made','found','ach','keys','buffs','flags','known','spec','cds'].forEach(k => ST[k] = ST[k] || {});
    ST.comm = ST.comm || []; ST.q = ST.q || [];
    try { localStorage.setItem('shattrath_last', JSON.stringify({name, guild})); } catch(e) {}
    await new Promise(r => { let n = 0; const done = () => { if (++n === 4) r(); }; NET.on('members', v => { G.members = v || {}; DIRTY = true; }); NET.on('bank', v => { G.bank = v || {}; DIRTY = true; done(); }); NET.on('market', v => { G.market = v || {}; done(); }); NET.on('project', v => { const prev = G.project?.phase; G.project = v || {phase:0, got:{}}; DIRTY = true; done(); }); done(); setTimeout(r, 6000); });
    $('#ldFill').style.width = '85%';
    MYSID = Math.random().toString(36).slice(2);
    await NET.claim(MYSID);
    NET.onSession(sid => { if (sid && sid !== MYSID) { LOCKED = true; modal(`<div class="ftitle">Disconnected</div><div class="fbody"><p>${esc(ST.name)} has logged in from another device. Only one session can play at a time.</p><div class="actions"><button class="btn" onclick="location.reload()">Log in here again</button></div></div>`); } });
    // Offline progress
    const away = now() - ST.t, inv0 = Object.assign({}, ST.inv), gold0 = ST.gold, sk0 = Object.fromEntries(Object.entries(ST.profs).map(([p, v]) => [p, v.s]));
    const out = newOut(false); advance(ST, now(), out);
    if (away > 20 * H) ST.flags.away = 1;
    await new Promise(r => setTimeout(r, 500)); $('#ldFill').style.width = '100%';
    await new Promise(r => setTimeout(r, 400));
    $('#loading').classList.add('hidden'); $('#app').classList.remove('hidden');
    chat('c-sys', `Welcome to Shattrath Trade! ${NET.mode === 'firebase' ? `Guild: &lt;${esc(GUILDNAME)}&gt;.` : 'Solo mode.'} Type /help for commands.`);
    NET.onChat(m => guildMsg(m));
    if (isNew) { chat('c-sys', 'You arrive in Shattrath City with 10 gold. A\'dal watches over you.'); VIEW = 'gather'; }
    seasonal();
    lastTick = now(); render(true);
    if (!isNew && away > 2 * MIN) offlineModal(away, out, inv0, gold0, sk0);
    for (const n of out.notable) NET.chat({pid:PID, name:ST.name, type:'loot', txt:n});
    checkAch(true); saveNow();
    setInterval(loop, 250);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); else { tick(); render(true); } });
    window.addEventListener('pagehide', saveNow);
    $('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') { onChatInput(e.target.value); e.target.value = ''; } });
    $('#chatBig').onclick = () => A.chatbig();
    $('#logo').onclick = () => { const t = now(); pokes = pokes.filter(x => t - x < 4000); pokes.push(t); if (pokes.length >= 7) { pokes = []; ST.flags.poke = 1; raidWarn('Stop poking me!'); chat('c-yell', 'Peasant yells: Stop poking me! ...Ready to work.'); checkAch(true); } };
  } catch(e) {
    console.error(e); $('#loading').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lgGo').disabled = false;
    err(e.message && e.message.includes('PIN') ? e.message : 'Could not connect: ' + (e.message || e));
  }
}
function offlineModal(away, out, inv0, gold0, sk0){
  const items = Object.entries(out.items).sort((a, b) => I(b[0]).q - I(a[0]).q || b[1] - a[1]);
  const skills = Object.entries(ST.profs).filter(([p, v]) => v.s !== sk0[p]).map(([p, v]) => `<div class="kv">${ic(PROFS[p].icon, {size:20, noTip:1})}<span style="flex:1;margin-left:6px">${PROFS[p].n}</span><span class="num">${sk0[p]} → <span class="grn">${v.s}</span></span></div>`).join('');
  const ev = out.ev; const evs = [ev.gank && `Ganked ${ev.gank} time(s) by rogues`, ev.ninja && `${ev.ninja} node(s) ninja'd by druids`, ev.rich && `${ev.rich} rich deposit(s)`, ev.procs && `${ev.procs} mastery proc(s)`, ev.boom && `${ev.boom} engineering explosion(s)`, ev.hogger && `Fought Hogger ${ev.hogger} time(s)`].filter(Boolean);
  modal(`<div class="ftitle">Welcome back, ${esc(ST.name)}</div><div class="fbody">
    <div class="parch small">While you were away (${fmtDur(away)}${away > CAP_OFFLINE ? ', progress capped at 24h' : ''}), your character kept working.</div>
    ${items.length ? `<div class="lbl" style="margin:10px 0 6px">Loot</div><div class="grid">${items.map(([n, q]) => `<div class="slot" data-a="item" data-n="${esc(n)}">${ic(n, {ct:q})}</div>`).join('')}</div>` : '<div class="hint" style="margin-top:8px">Nothing gathered. Set an activity before you leave next time!</div>'}
    ${out.gold ? `<div class="kv" style="margin-top:8px"><span class="lbl">Coin looted</span>${money(out.gold)}</div>` : ''}
    ${skills ? `<div class="lbl" style="margin:10px 0 4px">Skill-ups</div>${skills}` : ''}
    ${Object.keys(out.made).length ? `<div class="lbl" style="margin:10px 0 4px">Crafted</div><div class="small">${Object.entries(out.made).map(([n, q]) => `${ilink(n)} x${q}`).join(', ')}</div>` : ''}
    ${evs.length ? `<div class="lbl" style="margin:10px 0 4px">Events</div><div class="small">${evs.join(' · ')}</div>` : ''}
    <div class="actions"><button class="btn" data-a="close">Okay</button></div></div>`);
}
boot();

</script>
